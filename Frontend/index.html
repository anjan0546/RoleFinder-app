<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoleFinder – Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background -->
  <div class="bg-mesh"></div>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="nav-brand">
      <svg width="34" height="34" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="12" fill="url(#navLogoGrad)"/>
        <path d="M14 34l8-14 6 10 4-6 6 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="34" cy="16" r="4" fill="white" fill-opacity="0.9"/>
        <defs>
          <linearGradient id="navLogoGrad" x1="0" y1="0" x2="48" y2="48">
            <stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="nav-title">RoleFinder</span>
    </div>

    <div class="nav-actions">
      <button class="theme-btn" id="themeToggle" title="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 20 20" fill="none">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="user-chip" id="userChip">
        <div class="user-avatar" id="userAvatar">U</div>
        <span class="user-email" id="userEmail">user@email.com</span>
      </div>
      <button class="logout-btn" id="logoutBtn">
        <svg viewBox="0 0 20 20" fill="none">
          <path d="M13 7l3 3m0 0l-3 3m3-3H8m5-7H5a2 2 0 00-2 2v10a2 2 0 002 2h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Logout
      </button>
    </div>
  </nav>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- Hero -->
    <section class="hero">
      <div class="hero-badge">🎯 AI-Powered Job Matching</div>
      <h1 class="hero-title">Discover Your <span class="gradient-text">Perfect Role</span></h1>
      <p class="hero-sub">Enter your skills below and we'll instantly match you with the best-fit tech careers.</p>
    </section>

    <!-- Search Card -->
    <div class="search-card">
      <div class="search-label">Your Skills</div>
      <div class="search-row">
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 20 20" fill="none">
            <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M15 15l-3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input id="skillsInput" type="text" placeholder="e.g. html, css, javascript, react" autocomplete="off" />
        </div>
        <button id="matchBtn" class="find-btn">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M13 7l3 3m0 0l-3 3m3-3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Find Roles
        </button>
      </div>

      <!-- Autocomplete suggestions -->
      <div id="suggestions" class="suggestions-panel"></div>

      <!-- Skill chips -->
      <div class="chip-row" id="chipRow"></div>
    </div>

    <!-- Results -->
    <div id="resultsSection" style="display:none;">
      <div class="results-header">
        <h2 id="resultsTitle" class="results-title">Your Matches</h2>
        <button id="backBtn" class="back-btn">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M7 13L4 10m0 0l3-3M4 10h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Clear
        </button>
      </div>
      <div id="results" class="results-grid"></div>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
